name: Brambletown starter review regressions

on:
  pull_request:
    paths:
      - "src/mod_customlogin.cpp"
      - "conf/mod_customlogin.conf.dist"
      - "data/sql/db-characters/updates/**"
      - "tests/test_starter_review.py"
      - ".github/workflows/starter-review.yml"

permissions:
  contents: read

jobs:
  review-guards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run starter receipts and source guard tests
        run: python3 tests/test_starter_review.py
      - name: Explain test scope
        run: echo "These are static/in-memory tests; full AzerothCore build and gameplay verification are separately required."
